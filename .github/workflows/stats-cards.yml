name: Generate GitHub stats cards

on:
  schedule:
    - cron: "0 6 * * *" # every day at 00:00 Mexico City time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&include_all_commits=true&bg_color=0D1117&title_color=FF8C00&icon_color=FF2E63&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D1117&title_color=FF8C00&text_color=C9D1D9&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          AUTO_PUSH: false

      # Productive time stays out: it would publish the hours of private commits
      - name: Copy summary cards
        run: |
          cp profile-summary-card-output/github_dark/0-profile-details.svg profile/profile-details.svg
          cp profile-summary-card-output/github_dark/1-repos-per-language.svg profile/repos-per-language.svg
          cp profile-summary-card-output/github_dark/2-most-commit-language.svg profile/most-commit-language.svg

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile
          if git commit -m "Update GitHub stats cards"; then
            git pull --rebase --autostash origin main
            git push
          fi
