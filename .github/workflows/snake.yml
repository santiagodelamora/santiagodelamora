name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *" # every day at 00:00 Mexico City time
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=#1F2328&color_dots=#EBEDF0,#FFD8A8,#FFA94D,#FF6A3D,#E0234E
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F0F6FC&color_dots=#161B22,#7A3412,#C2410C,#FF6A3D,#FF2E63

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
